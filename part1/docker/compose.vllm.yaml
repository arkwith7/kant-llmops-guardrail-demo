# Part 1·2 · Docker 로 vLLM 서버 띄우기
#   docker compose -f part1/docker/compose.vllm.yaml up -d
#   docker logs -f kant-vllm            # 모델 다운로드·로딩 확인 (첫 실행 수 분)
#   curl http://localhost:8000/v1/models
#
# ⚠ RTX 50 시리즈(Blackwell, sm_120) 노트북:
#   공식 이미지 버전에 따라 "no kernel image is available" 오류가 날 수 있습니다.
#   이 경우 Blackwell 을 지원하는 이미지로 VLLM_IMAGE 를 바꾸거나, Part 1 의 AWS g6(NVIDIA L4) 에서 실행하세요.
#   L4 는 공식 이미지가 지원하는 GPU 입니다.
# ⚠ Ollama 와 동시에 띄우면 GPU 메모리가 부족합니다. 시연 전 `ollama stop <모델>` 로 내려 두세요.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    container_name: kant-vllm
    ports:
      - "8000:8000"
    ipc: host                         # 텐서 병렬·워커 간 공유 메모리
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface   # 모델 캐시 재사용
    environment:
      - HF_TOKEN=${HF_TOKEN:-}        # Llama·Gemma 같은 라이선스 동의 모델만 필요
    command:
      - --model
      - ${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}   # 라이선스 동의 불필요, 노트북에서 빠르게 로딩
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.80}"
      - --max-model-len
      - "${VLLM_MAX_LEN:-4096}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"
