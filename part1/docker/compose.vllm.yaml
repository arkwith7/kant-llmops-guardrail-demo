# Part 1·2 · Docker 로 vLLM 서버 띄우기
#   docker compose -f part1/docker/compose.vllm.yaml up -d
#   docker logs -f kant-vllm            # 모델 다운로드·로딩 확인 (첫 실행 수 분)
#   curl http://localhost:8000/v1/models
#
# RTX 5090 Laptop GPU · WSL2 에서 v0.34.0 / Qwen2.5-1.5B 로 추론 확인.
# 다른 이미지 버전은 Blackwell 지원 여부를 확인하세요.
# ⚠ Ollama 와 동시에 띄우면 GPU 메모리가 부족합니다. 시연 전 `ollama stop <모델>` 로 내려 두세요.
services:
  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:v0.34.0}
    container_name: kant-vllm
    ports:
      - "127.0.0.1:8000:8000"
    ipc: host                         # 텐서 병렬·워커 간 공유 메모리
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface   # 모델 캐시 재사용
    environment:
      - HF_TOKEN=${HF_TOKEN:-}        # Llama·Gemma 같은 라이선스 동의 모델만 필요
    command:
      - ${VLLM_MODEL:-Qwen/Qwen2.5-1.5B-Instruct}   # 라이선스 동의 불필요, 노트북에서 빠르게 로딩
      - --gpu-memory-utilization
      - "${VLLM_GPU_UTIL:-0.80}"
      - --max-model-len
      - "${VLLM_MAX_LEN:-4096}"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: "no"
