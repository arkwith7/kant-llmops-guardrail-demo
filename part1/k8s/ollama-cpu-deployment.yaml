# Part 1 · 비교용: GPU 를 요청하지 않는 LLM Pod (kind 에서도 Running)
#   kubectl apply -f part1/k8s/ollama-cpu-deployment.yaml
#   kubectl exec deploy/ollama-cpu -- ollama pull llama3.2:1b
#   curl http://localhost:30080/v1/chat/completions -H "Content-Type: application/json" \
#     -d '{"model":"llama3.2:1b","messages":[{"role":"user","content":"안녕"}]}'
#
# 같은 클러스터에서 GPU Pod 는 Pending, CPU Pod 는 Running → 자원 요청이 배치를 결정함을 보여줌
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama-cpu
  labels: { app: ollama-cpu }
spec:
  replicas: 1
  selector:
    matchLabels: { app: ollama-cpu }
  template:
    metadata:
      labels: { app: ollama-cpu }
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 6Gi }
          readinessProbe:
            httpGet: { path: /, port: 11434 }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: ollama-cpu
spec:
  type: NodePort
  selector: { app: ollama-cpu }
  ports:
    - port: 11434
      targetPort: 11434
      nodePort: 30080
