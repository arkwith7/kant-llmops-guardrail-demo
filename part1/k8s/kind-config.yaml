# Part 1 · 로컬 Kubernetes 클러스터 (kind: Docker 안에 노드를 띄움)
#   kind create cluster --name kant --config part1/k8s/kind-config.yaml
#   kubectl get nodes
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # ollama-cpu Service(NodePort) → localhost:30080
        hostPort: 30080
